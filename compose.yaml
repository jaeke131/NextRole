services:
  postgres:
    image: postgres:17-alpine
    container_name: nextrole-postgres

    environment:
      POSTGRES_USER: nextrole_app
      POSTGRES_PASSWORD: nextrolepass
      POSTGRES_DB: nextrole

    ports:
      - "6543:5432"

    volumes:
      - nextrole_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U nextrole_app -d nextrole"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nextrole_pgdata: